rules:
  - id: weak-password-hashing-algorithm
    languages: [python]
    severity: ERROR
    message: >
      Password is hashed using a hashlib function that isn't an approved
      password-hashing algorithm. Fast, general-purpose hashes like MD5
      or SHA-1 are unsuitable for passwords since they can be brute-forced
      at high speed and don't apply a salt automatically.
    patterns:
      - pattern: hashlib.$ALGO($PASSWORD.encode()).hexdigest()
      - metavariable-regex:
          metavariable: $ALGO
          regex: ^(?!pbkdf2_hmac$|scrypt$).+$
